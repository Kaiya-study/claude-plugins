<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{BOOK_TITLE}}</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root {
    --ground: #EEEFEB;
    --paper: #FCFCF9;
    --paper-2: #F4F5F0;
    --ink: #1A211D;
    --ink-2: #58635C;
    --ink-3: #8B958E;
    --rule: #DDE0D9;
    --rule-2: #E8EBE4;
    --accent: #1D5A4C;
    --accent-wash: #E3EDE9;
    --annot: #8E6413;
    --annot-wash: #F7F1E2;
    --annot-rule: #D9C293;
    --shadow: 0 1px 2px rgba(26,33,29,.05), 0 16px 40px -24px rgba(26,33,29,.32);

    --f-body: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
    --f-ui: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
    --f-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #121513;
      --paper: #1A1E1B;
      --paper-2: #212623;
      --ink: #E7EAE4;
      --ink-2: #A2ADA5;
      --ink-3: #79837B;
      --rule: #2C332E;
      --rule-2: #252B27;
      --accent: #63C0A6;
      --accent-wash: #1B2B27;
      --annot: #D6A64C;
      --annot-wash: #2A2416;
      --annot-rule: #5A4A22;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 16px 40px -24px rgba(0,0,0,.85);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --ground: #121513;
    --paper: #1A1E1B;
    --paper-2: #212623;
    --ink: #E7EAE4;
    --ink-2: #A2ADA5;
    --ink-3: #79837B;
    --rule: #2C332E;
    --rule-2: #252B27;
    --accent: #63C0A6;
    --accent-wash: #1B2B27;
    --annot: #D6A64C;
    --annot-wash: #2A2416;
    --annot-rule: #5A4A22;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 16px 40px -24px rgba(0,0,0,.85);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: var(--f-body); font-size: 17px; line-height: 1.95;
    -webkit-font-smoothing: antialiased;
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }

  /* ---------- reading progress ---------- */
  .progress {
    position: fixed; top: 0; left: 0; height: 2px; width: 0;
    background: var(--accent); z-index: 60; transition: width .1s linear;
  }

  /* ---------- shell ---------- */
  .shell {
    display: grid; grid-template-columns: 16rem minmax(0, 1fr);
    gap: clamp(1.5rem, 4vw, 3.5rem);
    max-width: 68rem; margin: 0 auto;
    padding: clamp(1rem, 3vw, 2.5rem) clamp(1rem, 4vw, 2rem) 6rem;
  }
  @media (max-width: 62rem) { .shell { grid-template-columns: minmax(0, 1fr); } }

  /* ---------- rail ---------- */
  .rail { font-family: var(--f-ui); }
  @media (min-width: 62.01rem) {
    .rail { position: sticky; top: clamp(1rem, 3vw, 2.5rem); align-self: start; max-height: calc(100vh - 4rem); overflow-y: auto; }
  }
  .book-title {
    font-family: var(--f-body); font-weight: 800; font-size: 1.02rem;
    line-height: 1.5; margin: 0 0 .2rem;
  }
  .book-sub { font-size: .72rem; color: var(--ink-3); margin: 0 0 1.4rem; letter-spacing: .04em; }

  .rail-h {
    font-size: .64rem; font-weight: 700; letter-spacing: .17em; text-transform: uppercase;
    color: var(--ink-3); margin: 0 0 .6rem;
  }
  .toc { list-style: none; margin: 0 0 1.8rem; padding: 0; display: grid; gap: .1rem; }
  .toc a, .toc span {
    display: flex; gap: .55rem; align-items: baseline;
    padding: .3rem .5rem; border-radius: 3px;
    font-size: .8rem; line-height: 1.5; text-decoration: none; color: var(--ink-2);
  }
  .toc a:hover { background: var(--paper); color: var(--accent); }
  .toc a.is-here { background: var(--accent-wash); color: var(--accent); font-weight: 500; }
  .toc .no { flex: none; font-family: var(--f-mono); font-size: .72rem; color: var(--ink-3); }
  .toc a.is-here .no { color: var(--accent); }
  .toc .todo { color: var(--ink-3); }
  .toc .todo .no { opacity: .55; }
  .toc .mark { margin-left: auto; font-size: .64rem; color: var(--ink-3); letter-spacing: .05em; }

  .profile {
    background: var(--paper); border: 1px solid var(--rule); border-radius: 3px;
    padding: .85rem .9rem; box-shadow: var(--shadow);
  }
  .profile dl { margin: 0; display: grid; gap: .28rem; font-size: .75rem; }
  .profile .row { display: flex; gap: .5rem; align-items: baseline; }
  .profile dt { color: var(--ink-2); }
  .profile dd { margin: 0 0 0 auto; font-size: .68rem; font-weight: 700; letter-spacing: .04em; white-space: nowrap; }
  .st-known { color: var(--accent); }
  .st-shaky { color: var(--annot); }
  .st-new { color: var(--ink-3); }
  .profile-note {
    font-size: .68rem; line-height: 1.65; color: var(--ink-3);
    margin: .7rem 0 0; padding-top: .6rem; border-top: 1px solid var(--rule-2);
  }

  /* ---------- page ---------- */
  .page {
    background: var(--paper); border: 1px solid var(--rule); border-radius: 4px;
    box-shadow: var(--shadow);
    padding: clamp(1.5rem, 5vw, 3.6rem) clamp(1.1rem, 5vw, 3.6rem) clamp(2.5rem, 6vw, 4rem);
  }
  .chap-line {
    font-family: var(--f-ui); font-size: .68rem; font-weight: 700;
    letter-spacing: .18em; text-transform: uppercase; color: var(--ink-3);
    margin: 0 0 1.6rem; padding-bottom: .8rem; border-bottom: 1px solid var(--rule);
  }
  .editors-note {
    font-family: var(--f-ui); font-size: .76rem; line-height: 1.8; color: var(--ink-3);
    border-left: 2px solid var(--rule); padding: .1rem 0 .1rem .8rem; margin: 0 0 2.4rem;
  }

  h2 {
    font-family: var(--f-body); font-weight: 600; font-size: 1.24rem; line-height: 1.6;
    margin: 3.2rem 0 1.3rem; scroll-margin-top: 1.5rem; text-wrap: balance;
  }
  h2:first-of-type { margin-top: 0; }
  h2 .secno { color: var(--ink-3); margin-right: .65em; font-variant-numeric: tabular-nums; }
  p { margin: 0 0 1.3rem; }

  /* ---------- figures ---------- */
  .fig { margin: 1.9rem 0; text-align: center; }
  .fig img {
    max-width: 100%; height: auto;
    background: #fff; border: 1px solid var(--rule); border-radius: 3px;
  }
  .fig figcaption {
    font-family: var(--f-ui); font-size: .76rem; color: var(--ink-3); margin-top: .6rem;
  }

  /* ---------- equations ---------- */
  .eq { margin: 1.6rem 0; }
  .eq-line { display: flex; align-items: center; gap: .8rem; }
  .eq-body { flex: 1; min-width: 0; overflow-x: auto; overflow-y: hidden; text-align: center; padding: .3rem 0; }
  .eq-body mjx-container { margin: 0 !important; }
  .eq-num {
    flex: none; font-family: var(--f-ui); font-size: .76rem; color: var(--ink-3);
    font-variant-numeric: tabular-nums;
  }
  .eq-foot { display: flex; align-items: center; gap: .5rem; margin-top: .15rem; padding-left: .1rem; }

  .open-gap {
    display: inline-flex; align-items: center; gap: .38rem;
    font-family: var(--f-ui); font-size: .74rem; font-weight: 500;
    background: transparent; border: 0; padding: .12rem 0; cursor: pointer;
    color: var(--annot);
  }
  .open-gap:hover { text-decoration: underline; text-underline-offset: 3px; }
  .open-gap .pm {
    display: inline-flex; align-items: center; justify-content: center;
    width: 13px; height: 13px; border: 1px solid var(--annot-rule); border-radius: 2px;
    font-family: var(--f-mono); font-size: .62rem; line-height: 1;
  }
  .tool {
    font-family: var(--f-ui); font-size: .71rem;
    background: transparent; color: var(--ink-3); border: 0; padding: .12rem 0;
    cursor: pointer; opacity: 0; transition: opacity .18s, color .15s;
  }
  .eq:hover .tool, .tool:focus-visible { opacity: 1; }
  .tool:hover { color: var(--accent); }
  .eq-foot .sep { color: var(--rule); font-size: .7rem; opacity: 0; transition: opacity .18s; }
  .eq:hover .eq-foot .sep { opacity: 1; }

  /* ---------- equation cross-references ---------- */
  .eqref {
    color: var(--accent); text-decoration: none; cursor: pointer;
    border-bottom: 1px dashed color-mix(in srgb, var(--accent) 45%, transparent);
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .eqref:hover { border-bottom-style: solid; }
  .eq { border-radius: 3px; transition: background .5s ease; }
  .eq.is-flash { background: var(--accent-wash); }
  .used-by {
    font-family: var(--f-ui); font-size: .7rem; color: var(--ink-3);
    display: inline-flex; gap: .3rem; align-items: baseline; flex-wrap: wrap;
  }
  .used-by .eqref { border-bottom-color: color-mix(in srgb, var(--ink-3) 45%, transparent); color: var(--ink-3); }
  .used-by .eqref:hover { color: var(--accent); }
  .used-by .secref {
    color: var(--ink-3); cursor: pointer;
    border-bottom: 1px dashed color-mix(in srgb, var(--ink-3) 45%, transparent);
  }
  .used-by .secref:hover { color: var(--accent); border-bottom-color: var(--accent); }
  .eqpop {
    position: fixed; z-index: 65; max-width: min(92vw, 34rem);
    background: var(--paper); border: 1px solid var(--rule); border-radius: 4px;
    box-shadow: var(--shadow); padding: .45rem .85rem .55rem;
    opacity: 0; pointer-events: none; transition: opacity .14s;
    overflow-x: auto;
  }
  .eqpop.is-on { opacity: 1; }
  .eqpop-num {
    display: block; font-family: var(--f-ui); font-size: .62rem;
    letter-spacing: .12em; color: var(--ink-3); margin-bottom: .1rem;
  }

  /* ---------- 注釈（原著の脚注） ---------- */
  .noteref {
    color: var(--annot); cursor: pointer; font-size: .72em;
    vertical-align: super; line-height: 0; padding: 0 .12em;
    border-bottom: 1px solid color-mix(in srgb, var(--annot) 45%, transparent);
  }
  .noteref:hover { color: var(--accent); border-bottom-color: var(--accent); }
  .note {
    font-size: .84rem; color: var(--ink-2); line-height: 1.75;
    margin: .55rem 0 1.15rem; padding: .1rem 0 .1rem .85rem;
    border-left: 2px solid var(--rule);
    transition: background .2s, border-color .2s;
  }
  .note .note-mark { color: var(--annot); margin-right: .45em; font-family: var(--f-ui); }
  .note.is-flash { background: var(--accent-wash); border-left-color: var(--accent); }

  /* ---------- original-only mode ---------- */
  .rail-toggle {
    display: flex; align-items: center; gap: .5rem; width: 100%;
    font-family: var(--f-ui); font-size: .75rem; color: var(--ink-2);
    background: var(--paper); border: 1px solid var(--rule); border-radius: 3px;
    padding: .45rem .7rem; cursor: pointer; margin-bottom: 1.5rem;
    transition: color .15s, border-color .15s;
  }
  .rail-toggle:hover { color: var(--annot); border-color: var(--annot-rule); }
  .rail-toggle .dot {
    width: 8px; height: 8px; border-radius: 2px; flex: none;
    background: var(--annot); transition: background .15s;
  }
  body.original-only .gap,
  body.original-only .open-gap,
  body.original-only .editors-note { display: none; }
  body.original-only #origToggle .dot { background: var(--rule); }

  /* ---------- gap (補完) ---------- */
  .gap { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .3s ease; }
  .gap.is-open { grid-template-rows: 1fr; }
  .gap-inner { overflow: hidden; min-height: 0; }
  .gap-card {
    margin: .7rem 0 .3rem; padding: .95rem 1.1rem .8rem;
    background: var(--annot-wash); border-left: 2px solid var(--annot-rule);
    border-radius: 0 3px 3px 0;
    font-size: .93rem; line-height: 1.92; color: var(--ink-2);
  }
  .gap-tag {
    display: block; font-family: var(--f-ui); font-size: .62rem; font-weight: 700;
    letter-spacing: .16em; text-transform: uppercase; color: var(--annot);
    margin-bottom: .6rem;
  }
  .gap-card > p:last-of-type { margin-bottom: 0; }
  .gap-card p { margin: 0 0 .85rem; }
  .gap-card strong { color: var(--ink); font-weight: 600; }
  .gap-card .sub { overflow-x: auto; padding: .25rem 0; margin: .1rem 0 .85rem; }
  .gap-card .ref { color: var(--annot); font-style: normal; }

  .gap-card .keypoint {
    background: color-mix(in srgb, var(--annot) 9%, transparent);
    border-radius: 3px; padding: .55rem .75rem; margin: .1rem 0 .85rem;
    color: var(--ink);
  }
  .gap-card .keypoint strong { color: var(--annot); }
  .gap-card p.tight { font-size: .86em; color: var(--ink-3); margin-bottom: .4rem; }

  .ask {
    display: flex; flex-wrap: wrap; align-items: center; gap: .35rem;
    margin-top: .9rem; padding-top: .7rem; border-top: 1px solid var(--annot-rule);
  }
  .ask-lead {
    font-family: var(--f-ui); font-size: .67rem; font-weight: 700;
    letter-spacing: .1em; color: var(--annot); margin-right: .3rem;
  }
  .ask-chip {
    font-family: var(--f-ui); font-size: .72rem;
    background: var(--paper); color: var(--ink-2);
    border: 1px solid var(--annot-rule); border-radius: 3px;
    padding: .18rem .55rem; cursor: pointer; transition: color .15s, border-color .15s;
  }
  .ask-chip:hover { color: var(--annot); border-color: var(--annot); }

  .offline-note {
    font-family: var(--f-ui); font-size: .8rem; line-height: 1.7;
    background: var(--annot-wash); border-left: 3px solid var(--annot);
    border-radius: 0 3px 3px 0; padding: .8rem 1rem; margin: 0 0 2rem;
    color: var(--ink);
  }
  .offline-note b { color: var(--annot); }

  /* ---------- colophon ---------- */
  .colophon {
    margin-top: 4rem; padding-top: 1.3rem; border-top: 1px solid var(--rule);
    font-family: var(--f-ui); font-size: .74rem; line-height: 1.8; color: var(--ink-3);
  }
  .colophon p { margin: 0 0 .6rem; }
  .colophon p:last-child { margin-bottom: 0; }

  /* ---------- toast / fallback ---------- */
  .toast {
    position: fixed; left: 50%; bottom: 1.5rem; transform: translate(-50%, 1rem);
    background: var(--ink); color: var(--paper);
    font-family: var(--f-ui); font-size: .79rem; font-weight: 500;
    padding: .5rem 1.05rem; border-radius: 999px;
    opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
    z-index: 70; max-width: min(90vw, 30rem); text-align: center;
  }
  .toast.is-on { opacity: 1; transform: translate(-50%, 0); }
  .fallback {
    position: fixed; inset: 0; z-index: 80; display: none;
    align-items: center; justify-content: center; padding: 1.5rem;
    background: color-mix(in srgb, var(--ground) 82%, transparent);
  }
  .fallback.is-on { display: flex; }
  .fallback-card {
    background: var(--paper); border: 1px solid var(--rule); border-radius: 4px;
    box-shadow: var(--shadow); padding: 1.2rem; width: min(38rem, 100%); font-family: var(--f-ui);
  }
  .fallback-card p { margin: 0 0 .7rem; font-size: .8rem; color: var(--ink-2); }
  .fallback-card textarea {
    width: 100%; min-height: 11rem; resize: vertical;
    font-family: var(--f-mono); font-size: .76rem; line-height: 1.6;
    color: var(--ink); background: var(--ground);
    border: 1px solid var(--rule); border-radius: 3px; padding: .7rem;
  }
  .btn {
    font-family: var(--f-ui); font-size: .78rem; font-weight: 500;
    color: var(--ink); background: transparent;
    border: 1px solid var(--rule); border-radius: 999px;
    padding: .34rem .85rem; cursor: pointer; margin-top: .7rem;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }

  @media (prefers-reduced-motion: reduce) { * { transition-duration: .01ms !important; } }
</style>
<noscript><style>.gap { grid-template-rows: 1fr !important; } .open-gap, .tool { display: none; }</style></noscript>
</head>
<body>
<div class="progress" id="progress"></div>

<div class="shell">

  <aside class="rail">
    <!-- RAIL -->
  </aside>

  <main class="page">
    <div class="offline-note" id="offlineNote" hidden>
      <b>数式を描画できませんでした。</b>これは軽量版で、数式の描画部品をネットから読み込みます。本文と補完はそのまま読めますが、数式は LaTeX のまま表示されます。ネットのない場所で読むなら、この本を作ったときのやりとりで「オフラインでも読めるように」と頼んでください。
    </div>
    <!-- CONTENT -->
  </main>
</div>

<div class="eqpop" id="eqpop" aria-hidden="true"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="fallback" id="fallback">
  <div class="fallback-card">
    <p>自動コピーがブロックされました。下のテキストを選択してコピーしてください。</p>
    <textarea id="fallbackText" readonly></textarea>
    <button class="btn" id="fallbackClose">閉じる</button>
  </div>
</div>

<script>
  (function () {
    Array.prototype.forEach.call(document.querySelectorAll('.gap-card'), function (el) {
      el.dataset.raw = el.textContent.replace(/\s+/g, ' ').trim();
    });
  })();
</script>
<script>
  window.MathJax = {
    tex: { packages: {'[-]': ['autoload', 'require']}, inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]']] },
    svg: { fontCache: 'global', scale: 1.02 },
    options: { enableMenu: false }
  };
</script>
<script id="MathJax-script" src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.js" onerror="var n=document.getElementById('offlineNote'); if(n) n.hidden=false;"></script>
<script>
(function () {
  'use strict';

  var BOOK_TITLE = '{{BOOK_TITLE}}';

  var toastEl = document.getElementById('toast'), toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg; toastEl.classList.add('is-on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('is-on'); }, 2000);
  }
  var fbEl = document.getElementById('fallback'), fbText = document.getElementById('fallbackText');
  document.getElementById('fallbackClose').addEventListener('click', function () { fbEl.classList.remove('is-on'); });
  function copyText(text, okMsg) {
    var legacy = function () {
      var ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly', '');
      ta.style.position = 'fixed'; ta.style.top = '-1000px';
      document.body.appendChild(ta); ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      if (ok) { toast(okMsg); }
      else { fbText.value = text; fbEl.classList.add('is-on'); fbText.focus(); fbText.select(); }
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast(okMsg); }, legacy);
    } else { legacy(); }
  }

  var ASK_TYPES = [
    { label: 'なぜ？', q: 'この変形の動機を教えてください。なぜこの形に持ち込むのか、発想の出どころが知りたいです。' },
    { label: '直感', q: 'この式の意味を、物理的・幾何的なイメージで説明してください。' },
    { label: 'もっと細かく', q: '上の補完を、さらに細かいステップに分解してください。各ステップで使っている定理・規則を明記してください。' },
    { label: '別の見方', q: '他の教科書や別のアプローチでは、この結果をどう導きますか。' },
    { label: '検算して', q: 'この式と、上の補完の内容が正しいか検算してください。誤りがあれば指摘してください。' }
  ];

  function buildPrompt(eq, gapCard, ask) {
    var lines = [
      '『' + BOOK_TITLE + '』の式 ' + (eq.getAttribute('data-num') || '') + ' について質問です。',
      '', '【該当の式（LaTeX）】', eq.getAttribute('data-tex') || '',
      '', '【原著の文脈】', eq.getAttribute('data-ctx') || ''
    ];
    if (gapCard && gapCard.dataset.raw) {
      lines.push('', '【手元の版に補完されている説明】', gapCard.dataset.raw);
    }
    lines.push('', '【質問】', ask, '',
      '※ 途中式を省略せず、各ステップで使っている定理や仮定を明示してください。',
      '※ 上の補完と食い違う場合は、どちらがなぜ正しいかを述べてください。');
    return lines.join('\n');
  }

  Array.prototype.forEach.call(document.querySelectorAll('.eq'), function (eq) {
    var foot = eq.querySelector('.eq-foot');
    var gap = eq.querySelector('.gap');
    var num = eq.getAttribute('data-num') || '';

    if (gap) {
      gap.classList.remove('is-open');  /* 既定は閉じた状態。出力側が誤って付けていても畳む */
      var btn = document.createElement('button');
      btn.className = 'open-gap';
      btn.type = 'button';
      btn.setAttribute('aria-expanded', 'false');
      btn.innerHTML = '<span class="pm" aria-hidden="true">+</span><span class="lbl">途中式をひらく</span>';
      btn.addEventListener('click', function () {
        var on = gap.classList.toggle('is-open');
        btn.setAttribute('aria-expanded', on ? 'true' : 'false');
        btn.querySelector('.pm').textContent = on ? '−' : '+';
        btn.querySelector('.lbl').textContent = on ? '途中式をとじる' : '途中式をひらく';
      });
      foot.appendChild(btn);

      var card = gap.querySelector('.gap-card');
      var ask = document.createElement('div');
      ask.className = 'ask';
      var lead = document.createElement('span');
      lead.className = 'ask-lead';
      lead.textContent = 'この説明について聞く';
      ask.appendChild(lead);
      ASK_TYPES.forEach(function (t) {
        var chip = document.createElement('button');
        chip.className = 'ask-chip'; chip.type = 'button'; chip.textContent = t.label;
        chip.addEventListener('click', function () {
          copyText(buildPrompt(eq, card, t.q), '「' + t.label + '」の質問文をコピーしました');
        });
        ask.appendChild(chip);
      });
      card.appendChild(ask);

      var sep = document.createElement('span');
      sep.className = 'sep'; sep.textContent = '／';
      foot.appendChild(sep);
    }

    var tex = document.createElement('button');
    tex.className = 'tool'; tex.type = 'button'; tex.textContent = 'TeXをコピー';
    tex.addEventListener('click', function () {
      copyText(eq.getAttribute('data-tex') || '', '式 ' + num + ' のLaTeXをコピーしました');
    });
    foot.appendChild(tex);
  });

  /* ---- 式台帳：番号 → 式、および逆引き（どこで使われているか） ---- */
  var registry = {};
  Array.prototype.forEach.call(document.querySelectorAll('.eq'), function (eq) {
    var num = eq.getAttribute('data-num') || '';
    eq.id = 'eq' + num.replace(/[^0-9]+/g, '-').replace(/^-|-$/g, '');
    registry[num] = eq;
  });

  /* ---- 逆引き（この式を使うところ） ---- */
  /* 式の中からの参照は式番号で、本文からの参照は節で示す。
     式の中だけに絞ると半分以上を取りこぼすため、両方を拾う。 */
  var usedBy = {}, usedIn = {}, secLabel = {}, curSec = '';
  Array.prototype.forEach.call(document.querySelectorAll('h2[id], .eqref'), function (el) {
    if (el.tagName === 'H2') {
      curSec = el.id;
      var no = el.querySelector('.secno');
      secLabel[curSec] = no ? no.textContent.trim() : el.textContent.trim();
      return;
    }
    var target = el.getAttribute('data-ref');
    if (!registry[target]) { return; }
    var owner = el.closest('.eq');
    if (owner) {
      if (owner === registry[target]) { return; }
      (usedBy[target] = usedBy[target] || []).push(owner.getAttribute('data-num'));
    } else if (curSec) {
      (usedIn[target] = usedIn[target] || []).push(curSec);
    }
  });

  function uniq(list) {
    return list.filter(function (v, i, arr) { return arr.indexOf(v) === i; });
  }

  Object.keys(registry).forEach(function (num) {
    var eqs = uniq(usedBy[num] || []);
    var secs = uniq(usedIn[num] || []);
    if (!eqs.length && !secs.length) { return; }
    var foot = registry[num].querySelector('.eq-foot');
    if (!foot) { return; }
    var wrap = document.createElement('span');
    wrap.className = 'used-by';
    wrap.appendChild(document.createTextNode('この式を使うところ：'));
    eqs.forEach(function (n) {
      var a = document.createElement('a');
      a.className = 'eqref'; a.setAttribute('data-ref', n); a.textContent = n;
      wrap.appendChild(a);
    });
    secs.forEach(function (id) {
      var a = document.createElement('a');
      a.className = 'secref'; a.setAttribute('data-secref', id);
      a.textContent = (secLabel[id] || id) + '節';
      wrap.appendChild(a);
    });
    foot.insertBefore(wrap, foot.firstChild);
  });

  /* ---- 参照のジャンプとポップオーバー ---- */
  var pop = document.getElementById('eqpop');
  var canHover = window.matchMedia && window.matchMedia('(hover: hover)').matches;
  var flashTimer = null;

  function jumpTo(num) {
    var eq = registry[num];
    if (!eq) { return; }
    hidePop();
    eq.scrollIntoView({ behavior: 'smooth', block: 'center' });
    clearTimeout(flashTimer);
    eq.classList.add('is-flash');
    flashTimer = setTimeout(function () { eq.classList.remove('is-flash'); }, 1400);
  }
  function showPop(link, num) {
    var eq = registry[num];
    if (!eq || !canHover) { return; }
    var body = eq.querySelector('.eq-body');
    pop.innerHTML = '<span class="eqpop-num">' + num + '</span>' + body.innerHTML;
    pop.classList.add('is-on');
    var r = link.getBoundingClientRect();
    var pr = pop.getBoundingClientRect();
    var left = Math.min(Math.max(8, r.left + r.width / 2 - pr.width / 2), window.innerWidth - pr.width - 8);
    var top = r.top - pr.height - 8;
    if (top < 8) { top = r.bottom + 8; }
    pop.style.left = left + 'px';
    pop.style.top = top + 'px';
  }
  function hidePop() { pop.classList.remove('is-on'); }

  document.addEventListener('click', function (e) {
    var a = e.target.closest ? e.target.closest('.eqref') : null;
    if (a) { e.preventDefault(); jumpTo(a.getAttribute('data-ref')); }
  });
  document.addEventListener('click', function (e) {
    var a = e.target.closest ? e.target.closest('.secref') : null;
    if (!a) { return; }
    e.preventDefault();
    var h = document.getElementById(a.getAttribute('data-secref'));
    if (!h) { return; }
    hidePop();
    h.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  document.addEventListener('mouseover', function (e) {
    var a = e.target.closest ? e.target.closest('.eqref') : null;
    if (a) { showPop(a, a.getAttribute('data-ref')); }
  });
  document.addEventListener('mouseout', function (e) {
    if (e.target.closest && e.target.closest('.eqref')) { hidePop(); }
  });
  document.addEventListener('focusin', function (e) {
    var a = e.target.closest ? e.target.closest('.eqref') : null;
    if (a) { showPop(a, a.getAttribute('data-ref')); }
  });
  document.addEventListener('focusout', hidePop);
  window.addEventListener('scroll', hidePop, { passive: true });
  Array.prototype.forEach.call(document.querySelectorAll('.eqref'), function (a) {
    a.setAttribute('tabindex', '0');
    a.setAttribute('role', 'link');
    a.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); jumpTo(a.getAttribute('data-ref')); }
    });
  });

  /* ---- 注釈（原著の脚注）。式番号と同じ仕掛けを使う ---- */
  function jumpToNote(id) {
    var n = document.getElementById(id);
    if (!n) { return; }
    hidePop();
    n.scrollIntoView({ behavior: 'smooth', block: 'center' });
    clearTimeout(flashTimer);
    n.classList.add('is-flash');
    flashTimer = setTimeout(function () { n.classList.remove('is-flash'); }, 1400);
  }
  function showNotePop(link, id) {
    var n = document.getElementById(id);
    if (!n || !canHover) { return; }
    pop.innerHTML = '<span class="eqpop-num">注</span>' + n.innerHTML;
    pop.classList.add('is-on');
    var r = link.getBoundingClientRect();
    var pr = pop.getBoundingClientRect();
    var left = Math.min(Math.max(8, r.left + r.width / 2 - pr.width / 2), window.innerWidth - pr.width - 8);
    var top = r.top - pr.height - 8;
    if (top < 8) { top = r.bottom + 8; }
    pop.style.left = left + 'px';
    pop.style.top = top + 'px';
  }
  document.addEventListener('click', function (e) {
    var a = e.target.closest ? e.target.closest('.noteref') : null;
    if (a) { e.preventDefault(); jumpToNote(a.getAttribute('data-note')); }
  });
  document.addEventListener('mouseover', function (e) {
    var a = e.target.closest ? e.target.closest('.noteref') : null;
    if (a) { showNotePop(a, a.getAttribute('data-note')); }
  });
  document.addEventListener('mouseout', function (e) {
    if (e.target.closest && e.target.closest('.noteref')) { hidePop(); }
  });
  Array.prototype.forEach.call(document.querySelectorAll('.noteref'), function (a) {
    a.setAttribute('tabindex', '0');
    a.setAttribute('role', 'link');
    a.addEventListener('focus', function () { showNotePop(a, a.getAttribute('data-note')); });
    a.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); jumpToNote(a.getAttribute('data-note')); }
    });
  });

  /* ---- 原著のみ表示 ---- */
  var origBtn = document.getElementById('origToggle');
  if (origBtn) {
    origBtn.addEventListener('click', function () {
      var on = document.body.classList.toggle('original-only');
      origBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
      origBtn.querySelector('.lbl').textContent = on ? '原著のみ表示中' : '補完を表示中';
    });
  }

  /* MathJax が動かなかったときの保険 */
  setTimeout(function () {
    var n = document.getElementById('offlineNote');
    if (n && !document.querySelector('mjx-container') && document.querySelector('.eq-body')) { n.hidden = false; }
  }, 8000);

  /* reading progress + toc highlight */
  var bar = document.getElementById('progress');
  var links = Array.prototype.slice.call(document.querySelectorAll('.toc a'));
  var secs = links.map(function (a) { return document.getElementById(a.getAttribute('data-sec')); });
  function onScroll() {
    var h = document.documentElement.scrollHeight - window.innerHeight;
    bar.style.width = (h > 0 ? (window.scrollY / h) * 100 : 0) + '%';
    var idx = 0;
    secs.forEach(function (s, i) { if (s && s.getBoundingClientRect().top < window.innerHeight * 0.35) { idx = i; } });
    links.forEach(function (a, i) { a.classList.toggle('is-here', i === idx); });
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', onScroll);
  onScroll();
})();
</script>
</body>
</html>
